name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Lint (clippy, with the limits of AGENTS.md)
      run: cargo clippy --all-targets -- -D warnings
    - name: Run tests (with the file and function limits of tests/code_size.rs)
      run: cargo test --verbose
