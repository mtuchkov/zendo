# The keys of zendo: for each pane, the keys of each action. zendo ships this file as its default.
#
# To change keys, copy it: `zendo keymap > ~/.zendo/keymap.toml`, change what you want, and set
# `keymap = "~/.zendo/keymap.toml"` in ~/.zendo/config.toml. An action that your file leaves out
# keeps its default keys. `[keys.<pane>]` in the config changes single keys after the file.
#
# A key: `j`, `J`, `+`, `ctrl-b`, `alt-i`, `shift-down`, `ctrl-shift-h`, `alt-shift-left`, `enter`,
# `esc`, `tab`, `space`, `backspace`, `delete`, `up`, `down`, `left`, `right`, `home`, `end`,
# `pageup`, `pagedown`, `f1`…`f12`. The keys of a pane come first, then the global keys.
# `[selection]` holds the keys while text is selected where you write (the note in write mode, the
# chat input): they come before the keys of the pane, so there a letter key does not type.
# `zendo doctor` reports unknown panes, actions and keys, and a key of two actions in one pane.
# The `# <group>` lines group the actions of a pane as the help does: navigation, text selection,
# editing, features, sessions and terminals, panes and view, zendo.
# A terminal without the kitty keyboard protocol sends ctrl-shift-k as ctrl-k: there a ctrl key with
# no action of its own does the action of ctrl-shift and the key.


[global]
# navigation
next_pane = ["tab"]  # next pane
find = ["alt-/"]  # find a file: the recent files, by path and by text

# editing
new_note = ["alt-n"]  # a new note in a float

# sessions and terminals
session_1 = ["f6", "alt-f6"]  # agent session 1
session_2 = ["f7", "alt-f7"]  # agent session 2
session_3 = ["f8", "alt-f8"]  # agent session 3
session_4 = ["f9", "alt-f9"]  # agent session 4
session_5 = ["f10", "alt-f10"]  # agent session 5
next_session = ["alt-]"]  # the next agent session, after the last the terminals
prev_session = ["alt-[", "alt-p"]  # the previous agent session or terminal
terminal = ["f5"]  # put the shell block under the cursor into a terminal; elsewhere the F5 terminal
terminal_run = ["alt-f5"]  # put the shell block under the cursor into a terminal and run it

# panes and view
toggle_tree = ["alt-b", "ctrl-shift-b"]  # file tree
wider = ["alt-="]  # a wider text column
narrower = ["alt--"]  # a narrower text column
edge_left = ["ctrl-left"]  # move the edge of the pane in focus
edge_right = ["ctrl-right"]  # move the edge of the pane in focus

# zendo
help = ["alt-?", "f1"]  # the keys of this pane
quit = ["ctrl-q"]  # quit; ctrl-c copies

[read]
# navigation
down = ["j", "down"]  # cursor down
up = ["k", "up"]  # cursor up
left = ["h", "left"]  # cursor left
right = ["l", "right"]  # cursor right
page_down = ["space", "pagedown"]  # page down
page_up = ["b", "pageup"]  # page up
top = ["g", "home"]  # top
bottom = ["G", "end"]  # bottom
next_note = ["]"]  # next note
prev_note = ["["]  # previous note
search = ["/"]  # find a file: the recent files, by path and by text

# text selection
select = ["v"]  # start / stop a selection
select_down = ["ctrl-shift-j", "ctrl-shift-down", "alt-shift-j", "J", "shift-down"]  # select down
select_up = ["ctrl-shift-k", "ctrl-shift-up", "alt-shift-k", "K", "shift-up"]  # select up
select_left = ["ctrl-shift-h", "ctrl-shift-left", "H", "shift-left"]  # select left
select_right = ["ctrl-shift-l", "ctrl-shift-right", "L", "shift-right"]  # select right
select_word_left = ["alt-shift-h", "alt-shift-left"]  # select a word left
select_word_right = ["alt-shift-l", "alt-shift-right"]  # select a word right
copy = ["y", "ctrl-c"]  # copy the selection

# editing
write = ["i", "enter"]  # write here
new = ["n"]  # new note

# features
ask = ["a"]  # ask Claude about the selection
add_to_chat = ["alt-a", "ctrl-shift-a", "+"]  # add the selection to the chat
say = ["alt-s", "ctrl-shift-s"]  # here is what I want to say: the agent writes it here, or writes the selection again
split = ["S"]  # over the word limit: Claude splits it, keeps the altitude
recap = ["r"]  # recap now
recap_toggle = ["R"]  # show / hide the recap
review = ["ctrl-r"]  # twice: Claude marks the confusing lines and sums up the file

# panes and view
chat = ["c", "ctrl-shift-c"]  # chat on / off
delta = ["d"]  # delta
tree = ["e"]  # file tree
notes = ["o"]  # notes
layout = ["w"]  # standard / wide screen
theme = ["t"]  # theme
back = ["esc"]  # clear the selection, close a pane

# zendo
help = ["?"]  # all keys
upgrade = ["U"]  # upgrade zendo
quit = ["q"]  # quit

[write]
# navigation
word_left = ["ctrl-left", "alt-left"]  # word left
word_right = ["ctrl-right", "alt-right"]  # word right
home = ["home", "ctrl-a"]  # line start
end = ["end"]  # line end

# text selection
select_left = ["ctrl-shift-h", "ctrl-shift-left", "shift-left"]  # select left
select_right = ["ctrl-shift-l", "ctrl-shift-right", "shift-right"]  # select right
select_up = ["ctrl-shift-k", "ctrl-shift-up", "alt-shift-k", "shift-up"]  # select up
select_down = ["ctrl-shift-j", "ctrl-shift-down", "alt-shift-j", "shift-down"]  # select down
select_word_left = ["alt-shift-h", "alt-shift-left"]  # select a word left
select_word_right = ["alt-shift-l", "alt-shift-right"]  # select a word right
select_home = ["shift-home"]  # select to the line start
select_end = ["shift-end"]  # select to the line end
copy = ["ctrl-c"]  # copy

# editing
done = ["esc"]  # save and read; write mode saves by itself after a pause
cut = ["ctrl-x"]  # cut
paste = ["ctrl-v"]  # paste
bold = ["ctrl-b"]  # **bold** the selection or the word
italic = ["ctrl-i", "alt-i"]  # *italic* the selection or the word
underline = ["ctrl-u"]  # <u>underline</u> the selection or the word
delete_word = ["ctrl-w", "alt-backspace", "ctrl-backspace"]  # delete the word before
indent = ["tab"]  # indent

# features
say = ["alt-s", "ctrl-shift-s"]  # here is what I want to say: the agent writes it here, or writes the selection again
add_to_chat = ["alt-a", "ctrl-shift-a"]  # add the selection, or the line, to the chat
review = ["ctrl-r"]  # twice: Claude marks the confusing lines and sums up the file

# panes and view
chat = ["ctrl-g", "ctrl-shift-c"]  # chat on / off: saves first
delta = ["ctrl-d"]  # delta
toggle_tree = ["alt-b", "ctrl-shift-b", "ctrl-e"]  # file tree

[chat]
# navigation
scroll_up = ["pageup"]  # scroll up
scroll_down = ["pagedown"]  # scroll down
word_left = ["ctrl-left", "alt-left"]  # word left
word_right = ["ctrl-right", "alt-right"]  # word right
home = ["home", "ctrl-a"]  # line start
end = ["end", "ctrl-e"]  # line end

# text selection
select_left = ["ctrl-shift-h", "ctrl-shift-left", "shift-left"]  # select left
select_right = ["ctrl-shift-l", "ctrl-shift-right", "shift-right"]  # select right
select_word_left = ["alt-shift-h", "alt-shift-left"]  # select a word left
select_word_right = ["alt-shift-l", "alt-shift-right"]  # select a word right

# editing
send = ["enter"]  # send
newline = ["alt-enter", "shift-enter", "ctrl-j"]  # new line
delete_word = ["ctrl-w", "alt-backspace", "ctrl-backspace"]  # delete the word before
clear = ["ctrl-u"]  # clear the input
paste = ["ctrl-v"]  # paste

# features
new_thread = ["ctrl-n"]  # new thread
handoff = ["ctrl-o"]  # open the Claude Code session; with a terminal in the chat pane, the full screen
insert_output = ["alt-o"]  # put the result of the last command of a terminal into the input; again: the next terminal
templates = ["ctrl-t"]  # add a template: the agent writes a new document from it

# panes and view
back = ["esc"]  # stop the answer / back to the note

[selection]
# While text is selected in the note in write mode or in the chat input. Without a selection, these
# keys type as usual. In read mode and in the transcript, `copy` of the pane copies.

# text selection
copy = ["c"]  # copy the selection
cut = ["x"]  # cut the selection

[transcript]
# navigation
down = ["j", "down"]  # cursor down
up = ["k", "up"]  # cursor up
left = ["h", "left"]  # cursor left
right = ["l", "right"]  # cursor right
page_down = ["space", "pagedown"]  # page down
page_up = ["b", "pageup"]  # page up
top = ["g", "home"]  # top
bottom = ["G", "end"]  # bottom

# text selection
select = ["v"]  # start / stop a selection
select_down = ["ctrl-shift-j", "ctrl-shift-down", "alt-shift-j", "J", "shift-down"]  # select down
select_up = ["ctrl-shift-k", "ctrl-shift-up", "alt-shift-k", "K", "shift-up"]  # select up
select_left = ["ctrl-shift-h", "ctrl-shift-left", "H", "shift-left"]  # select left
select_right = ["ctrl-shift-l", "ctrl-shift-right", "L", "shift-right"]  # select right
select_word_left = ["alt-shift-h", "alt-shift-left"]  # select a word left
select_word_right = ["alt-shift-l", "alt-shift-right"]  # select a word right
copy = ["y", "ctrl-c"]  # copy the selection, or the message

# features
add_to_chat = ["a", "alt-a", "ctrl-shift-a", "+"]  # add the selection, or the message, to the chat

# panes and view
input = ["i", "enter"]  # back to the input
back = ["esc"]  # clear the selection / back to the input

[tree]
# navigation
down = ["j", "down"]  # down
up = ["k", "up"]  # up
top = ["g", "home"]  # top
bottom = ["G", "end"]  # bottom
unfold = ["+", "="]  # unfold [+]
fold = ["-"]  # fold [-]
close_folder = ["h", "left"]  # close the folder / go to the parent
search = ["/"]  # filter by file name

# editing
rename = ["f2"]  # rename the file
move = ["m"]  # move the file to a folder
new_file = ["f3"]  # new file
new_folder = ["f4"]  # new folder
delete = ["delete"]  # delete the file

# features
add_to_chat = ["a"]  # add the file to the chat

# panes and view
open = ["enter"]  # open in the note
preview = ["l", "right", "space"]  # open, stay in the tree
view = ["v"]  # structure, docs, all .md, text files, folders
layout = ["w"]  # standard / wide screen
delta = ["d"]  # delta
chat = ["c"]  # chat
close = ["esc", "e", "q"]  # close the tree

[delta]
# navigation
down = ["j", "down"]  # down
up = ["k", "up"]  # up
page_down = ["space", "pagedown"]  # page down
page_up = ["pageup"]  # page up
top = ["g", "home"]  # top
bottom = ["G", "end"]  # bottom

# features
base = ["b"]  # since the last visit / vs git HEAD
ask = ["a", "c"]  # ask Claude about the changes
recap = ["r"]  # recap now

# panes and view
layout = ["w"]  # standard / wide screen
write = ["i"]  # write
close = ["esc", "d", "q"]  # close the delta

[notes]
# navigation
down = ["j", "down"]  # down
up = ["k", "up"]  # up
top = ["g", "home"]  # top
bottom = ["G", "end"]  # bottom
search = ["/"]  # search
tags = ["#"]  # search tags

# editing
new = ["n"]  # new note
rename = ["r"]  # rename the file to the title
rename_file = ["f2"]  # rename the file
delete = ["delete"]  # delete the file

# panes and view
open = ["enter", "l", "right"]  # open
close = ["esc", "o", "q"]  # close

[session]
# A Claude Code session or a terminal on the whole screen, or a terminal in the chat pane. All other
# keys go to the program; alt-] and alt-[ go to the next and the previous session or terminal;
# F5 to F10 choose a session.

# panes and view
leave = ["alt-q"]  # back to zendo; the program runs on
