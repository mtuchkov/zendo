# The keys of zendo: for each pane, the keys of each action. zendo ships this file as its default.
#
# To change keys, copy it: `zendo keymap > ~/.zendo/keymap.toml`, change what you want, and set
# `keymap = "~/.zendo/keymap.toml"` in ~/.zendo/config.toml. An action that your file leaves out
# keeps its default keys. `[keys.<pane>]` in the config changes single keys after the file.
#
# A key: `j`, `J`, `+`, `ctrl-b`, `alt-i`, `shift-down`, `ctrl-shift-h`, `alt-shift-left`, `enter`,
# `esc`, `tab`, `space`, `backspace`, `delete`, `up`, `down`, `left`, `right`, `home`, `end`,
# `pageup`, `pagedown`, `f1`…`f12`. The keys of a pane come first, then the global keys.
# `zendo doctor` reports unknown panes, actions and keys, and a key of two actions in one pane.
# A terminal without the kitty keyboard protocol sends ctrl-shift-k as ctrl-k: there a ctrl key with
# no action of its own does the action of ctrl-shift and the key.


[global]
quit = ["ctrl-q", "ctrl-c"]  # quit
toggle_tree = ["alt-b", "ctrl-shift-b"]  # file tree
next_pane = ["tab"]  # next pane
help = ["f1"]  # the keys of this pane
wider = ["alt-="]  # a wider text column
narrower = ["alt--"]  # a narrower text column
edge_left = ["ctrl-left"]  # move the edge of the pane in focus
edge_right = ["ctrl-right"]  # move the edge of the pane in focus

[read]
down = ["j", "down"]  # cursor down
up = ["k", "up"]  # cursor up
left = ["h", "left"]  # cursor left
right = ["l", "right"]  # cursor right
select_down = ["ctrl-shift-j", "ctrl-shift-down", "alt-shift-j", "J", "shift-down"]  # select down
select_up = ["ctrl-shift-k", "ctrl-shift-up", "alt-shift-k", "K", "shift-up"]  # select up
select_left = ["ctrl-shift-h", "ctrl-shift-left", "H", "shift-left"]  # select left
select_word_left = ["alt-shift-h", "alt-shift-left"]  # select a word left
select_word_right = ["alt-shift-l", "alt-shift-right"]  # select a word right
select_right = ["ctrl-shift-l", "ctrl-shift-right", "L", "shift-right"]  # select right
select = ["v"]  # start / stop a selection
ask = ["a"]  # ask Claude about the selection
add_to_chat = ["alt-a", "ctrl-shift-a", "+"]  # add the selection to the chat
say = ["alt-s", "ctrl-shift-s"]  # here is what I want to say: the agent writes it here, or writes the selection again
copy = ["y", "ctrl-c"]  # copy the selection
split = ["S"]  # over the word limit: Claude splits it, keeps the altitude
write = ["i", "enter"]  # write here
new = ["n"]  # new note
notes = ["o"]  # notes
search = ["/"]  # search
chat = ["c", "ctrl-shift-c"]  # chat on / off
delta = ["d"]  # delta
tree = ["e"]  # file tree
recap = ["r"]  # recap now
recap_toggle = ["R"]  # show / hide the recap
layout = ["w"]  # standard / wide screen
theme = ["t"]  # theme
help = ["?"]  # all keys
upgrade = ["U"]  # upgrade zendo
page_down = ["space", "pagedown"]  # page down
page_up = ["b", "pageup"]  # page up
top = ["g", "home"]  # top
bottom = ["G", "end"]  # bottom
next_note = ["]"]  # next note
prev_note = ["["]  # previous note
back = ["esc"]  # clear the selection, close a pane
quit = ["q"]  # quit

[write]
done = ["esc"]  # save and read; write mode saves by itself after a pause
