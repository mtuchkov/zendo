chat = ["ctrl-g", "ctrl-shift-c"]  # chat on / off: saves first
add_to_chat = ["alt-a", "ctrl-shift-a"]  # add the selection, or the line, to the chat
delta = ["ctrl-d"]  # delta
toggle_tree = ["alt-b", "ctrl-shift-b", "ctrl-e"]  # file tree
bold = ["ctrl-b"]  # **bold** the selection or the word
italic = ["ctrl-i", "alt-i"]  # *italic* the selection or the word
underline = ["ctrl-u"]  # <u>underline</u> the selection or the word
copy = ["ctrl-c"]  # copy
cut = ["ctrl-x"]  # cut
paste = ["ctrl-v"]  # paste
select_left = ["ctrl-shift-h", "ctrl-shift-left", "shift-left"]  # select left
select_right = ["ctrl-shift-l", "ctrl-shift-right", "shift-right"]  # select right
select_up = ["ctrl-shift-k", "ctrl-shift-up", "alt-shift-k", "shift-up"]  # select up
select_down = ["ctrl-shift-j", "ctrl-shift-down", "alt-shift-j", "shift-down"]  # select down
select_word_left = ["alt-shift-h", "alt-shift-left"]  # select a word left
select_word_right = ["alt-shift-l", "alt-shift-right"]  # select a word right
select_home = ["shift-home"]  # select to the line start
select_end = ["shift-end"]  # select to the line end
word_left = ["ctrl-left", "alt-left"]  # word left
word_right = ["ctrl-right", "alt-right"]  # word right
