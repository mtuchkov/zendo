[package]
name = "zendo"
version = "0.41.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/mtuchkov/zendo"

[dependencies]
smart-default = "0.7"
agent-client-protocol = { version = "5.2.0", features = ["process", "stdio"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
globset = "0.4.21"
ignore = "0.4.34"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = { version = "3.2.1", features = ["inline"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy", "yaml-load"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
toml_edit = "0.25.19"
unicode-width = "0.2.3"
portable-pty = "0.9.0"
vt100 = "0.18.1"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# AGENTS.md, Code: short functions with few branches. clippy.toml has the limits.
[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"
