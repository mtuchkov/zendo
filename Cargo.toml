[package]
name = "zendo"
version = "0.121.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/mtuchkov/zendo"
# The integration tests are modules of one binary, tests/main.rs: one link instead of one for each
# file. tests/main.rs checks that each file of tests/ is a module there or a target below.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

# A binary of its own: .githooks/pre-commit runs it, and it builds faster alone.
[[test]]
name = "project_structure"
path = "tests/project_structure.rs"

[dependencies]
smart-default = "0.7"
agent-client-protocol = { version = "5.2.0", features = ["process", "stdio"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
globset = "0.4.21"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = { version = "3.2.1", features = ["inline"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy", "yaml-load"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
toml_edit = "0.25.19"
unicode-width = "0.2.3"
portable-pty = "0.9.0"
# The signals and the process groups of the background processes (ADR 0016).
rustix = { version = "1.1.6", features = ["process"] }
vt100 = "0.18.1"
base64 = "0.23.1"
flate2 = "1.1"
sha2 = "0.10"

# The lofi music plays through CoreAudio on macOS; Linux uses a system player (ADR 0006).
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
# The process tree of zendo from libproc, without `ps` (ADR 0023).
libc = "0.2"

[dev-dependencies]
serial_test = "3"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# AGENTS.md, Code: short functions with few branches. clippy.toml has the limits.
[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"

# Less debug info: target/ is about a third of the size, and the build is faster. Panics and
# backtraces still show the file and the line of zendo code. Dependencies get no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Full debug info for ratatui in a debugger: about 35 MB more in target/, the same build time.
[profile.dev.package.ratatui]
debug = "full"

[profile.dev.package.ratatui-core]
debug = "full"

[profile.dev.package.ratatui-crossterm]
debug = "full"

[profile.dev.package.ratatui-macros]
debug = "full"

[profile.dev.package.ratatui-widgets]
debug = "full"

# Full debug info for a debugger (variables, types, the code of the dependencies):
# cargo build --profile debugging, the binary is target/debugging/zendo.
[profile.debugging]
inherits = "dev"
debug = "full"

[profile.debugging.package."*"]
debug = "full"
